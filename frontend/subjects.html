<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Subjects</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 { text-align: center; color: #333; }
        .subject-list {
            margin: 1.5rem 0;
            max-height: 300px;
            overflow-y: auto;
        }
        .subject-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background-color: #0056b3; }
        .error { color: red; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Select Subjects (Max 4)</h2>
        <div id="error-msg" class="error"></div>
        <form id="subjects-form">
            <div id="subjects-list" class="subject-list"></div>
            <button type="submit">Confirm Selection</button>
        </form>
    </div>
    <script src="subjects.js"></script>
</body>
</html>
